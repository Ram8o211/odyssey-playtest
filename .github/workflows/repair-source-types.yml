name: Repair Odyssey TypeScript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-source-types.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Odyssey source
        uses: actions/checkout@v6
        with:
          repository: Ram8o211/odyssey-homeward-survival
          ref: feature/odyssey-vertical-slice
          token: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Apply targeted TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path('source')

          def replace(path: str, old: str, new: str, *, count: int | None = None) -> None:
              file = root / path
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'Expected pattern not found in {path}: {old!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Expected {count} occurrence(s) in {path}, found {found}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')
              print(f'patched {path}: {found} occurrence(s)')

          # Phaser 3.90 GameObjectCreator already does not add created objects to
          # the display list. Passing false as the second argument preserves the
          # original mask-only behavior and matches the current typings.
          for path in [
              'src/game/AuthoredTerrainTextureAssetPatch.ts',
              'src/game/GroundPatternDeperiodizationPatch.ts',
              'src/game/MeadowGrassletBasePatch.ts',
              'src/game/ReferenceMeadowFidelityPatch.ts',
              'src/game/SmoothShoreTransitionPatch.ts',
          ]:
              replace(
                  path,
                  'make.graphics({ x: 0, y: 0, add: false })',
                  'make.graphics({ x: 0, y: 0 }, false)',
              )

          replace(
              'src/game/PixelatedReferenceTerrainPatch.ts',
              '      bridge.drawSandGrassTransition(seed, island, sandBase, grassBase);',
              '      bridge.drawSandGrassTransition.call(this, seed, island, sandBase, grassBase);',
              count=1,
          )

          replace(
              'src/game/RelaxedCrewWanderPatch.ts',
              '''  state.target = intent.walkDistance > DISTANCE_EPSILON
              ? {
                x: follower.position.x + Math.cos(state.headingRad) * intent.walkDistance,
                y: follower.position.y + Math.sin(state.headingRad) * intent.walkDistance,
              }
              : undefined;''',
              '''  if (intent.walkDistance > DISTANCE_EPSILON) {
              state.target = {
                x: follower.position.x + Math.cos(state.headingRad) * intent.walkDistance,
                y: follower.position.y + Math.sin(state.headingRad) * intent.walkDistance,
              };
            } else {
              delete state.target;
            }''',
              count=1,
          )
          replace(
              'src/game/RelaxedCrewWanderPatch.ts',
              '          state.target = undefined;',
              '          delete state.target;',
              count=1,
          )

          replace(
              'src/game/ShoreDetailContinuityPatch.ts',
              '  SHORE_DETAIL_FULL_DENSITY_END_RATIO,\n',
              '',
              count=1,
          )

          replace(
              'src/game/rendering/GraphicsCuller.ts',
              '    if (camera.rotation !== 0) {',
              '''    const cameraRotation = 'rotation' in camera && typeof camera.rotation === 'number'
              ? camera.rotation
              : 0;
            if (cameraRotation !== 0) {''',
              count=1,
          )

          replace(
              'src/mobile/MobileInputController.ts',
              '      const primaryKey = keyNames[0];',
              '''      const primaryKey = keyNames[0];
              if (!primaryKey) return;''',
              count=1,
          )

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: source
        run: npm run typecheck

      - name: Unit tests
        working-directory: source
        run: npm run test

      - name: Production build
        working-directory: source
        run: npm run build

      - name: Commit validated fixes to vertical slice
        working-directory: source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game src/mobile
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix TypeScript regressions blocking production build"
          git push origin HEAD:feature/odyssey-vertical-slice
