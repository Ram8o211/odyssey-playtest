name: Deploy Odyssey playtest
# Public mirror deployment for the private Odyssey source.
# Public Pages follows odyssey-homeward-survival/main, the source of truth.
# Manual sync trigger: 2026-09-25T17:25Z.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: odyssey-playtest-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.change.outputs.changed }}
      source_sha: ${{ steps.change.outputs.source_sha }}
    steps:
      - name: Checkout playtest repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check private source token
        id: token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ODYSSEY_SOURCE_TOKEN is not configured yet; skipping this sync."
          fi

      - name: Checkout private Odyssey source
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v6
        with:
          repository: Ram8o211/odyssey-homeward-survival
          ref: main
          token: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Detect source update
        if: steps.token.outputs.available == 'true'
        id: change
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          LAST_SHA="$(cat .published-source-sha 2>/dev/null || true)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_SHA" = "$LAST_SHA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Odyssey source changes since $SOURCE_SHA; skipping build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing Odyssey source commit $SOURCE_SHA."
          fi

      - name: Setup Node
        if: steps.change.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        if: steps.change.outputs.changed == 'true'
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Build public playtest runtime
        if: steps.change.outputs.changed == 'true'
        working-directory: source
        env:
          VITE_BASE_PATH: /odyssey-playtest/
          PUBLIC_PLAYTEST: '1'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.change.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.change.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/dist

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout latest playtest repository state
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record deployed Odyssey source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > .published-source-sha
          git config user.name "github-actions[bot]"
          git config user.email "418982821+github-actions[bot]@users.noreply.github.com"
          git add .published-source-sha
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record deployed Odyssey source commit"
          git pull --rebase origin main
          git push origin HEAD:main
