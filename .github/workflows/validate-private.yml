name: Validate private Odyssey source

# Durable CI bridge for the private Odyssey repository. The private repository's
# hosted jobs have repeatedly failed before runner assignment; this repository
# has a working hosted runner and read-only private-source token.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private Odyssey branch, tag or commit to validate
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-private.yml'
      - '.validation-source-ref'

permissions:
  contents: write

concurrency:
  group: odyssey-private-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI bridge
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve private source ref
        id: target
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$DISPATCH_REF" ]; then
            SOURCE_REF="$DISPATCH_REF"
          else
            SOURCE_REF="$(tr -d '\r\n' < .validation-source-ref)"
          fi
          if [ -z "$SOURCE_REF" ]; then
            echo "::error::No private source ref configured."
            exit 1
          fi
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "Validating configured private Odyssey ref."

      - name: Verify private source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::ODYSSEY_SOURCE_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout private Odyssey source
        uses: actions/checkout@v4
        with:
          repository: Ram8o211/odyssey-homeward-survival
          ref: ${{ steps.target.outputs.ref }}
          token: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Private source checkout resolved successfully."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        shell: bash
        run: |
          if npm ci --no-audit --no-fund > /tmp/odyssey-npm-ci.log 2>&1; then
            echo "npm ci passed."
          else
            echo "::error::npm ci failed; source output intentionally suppressed on the public CI bridge."
            exit 1
          fi

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          if npm run typecheck > /tmp/odyssey-typecheck.log 2>&1; then
            echo "Typecheck passed."
          else
            echo "::error::Typecheck failed; source output intentionally suppressed on the public CI bridge."
            exit 1
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set +e
          npx eslint . -f json > /tmp/odyssey-eslint.json 2>/tmp/odyssey-eslint-stderr.log
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Lint passed."
          else
            echo "::error::Lint failed. Diagnostics below exclude source lines and file contents."
            jq -r '.[] | . as $file | .messages[] | select(.severity == 2) | "\($file.filePath | sub("^.*/source/"; "")):\(.line):\(.column) [\(.ruleId // "unknown")] \(.message)"' /tmp/odyssey-eslint.json | head -80
            exit 1
          fi

      - name: Unit and regression tests
        id: unit_tests
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/odyssey-vitest.json > /tmp/odyssey-vitest-run.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "Vitest suite passed."
          else
            echo "::error::Vitest failed. Failed test names below exclude source contents and stack traces."
            if [ -s /tmp/odyssey-vitest.json ]; then
              jq -r '.testResults[]? | select(.status == "failed") | ((.name | sub("^.*/source/"; "")) as $file | $file), (.assertionResults[]? | select(.status == "failed") | "  - \(.fullName // .title // "unnamed test")")' /tmp/odyssey-vitest.json | head -100
            else
              echo "Vitest did not produce a JSON report."
            fi
            exit 1
          fi

      - name: Production build
        id: build
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          if npm run build > /tmp/odyssey-build.log 2>&1; then
            echo "Production build passed."
          else
            echo "::error::Build failed; source output intentionally suppressed on the public CI bridge."
            exit 1
          fi

      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          if npx playwright install --with-deps chromium > /tmp/odyssey-playwright-install.log 2>&1; then
            echo "Playwright Chromium installed."
          else
            echo "::error::Playwright installation failed."
            exit 1
          fi

      - name: End-to-end tests
        id: e2e
        if: always() && steps.playwright_install.outcome == 'success'
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          if npm run test:e2e > /tmp/odyssey-e2e.log 2>&1; then
            echo "Playwright E2E passed."
          else
            echo "::error::Playwright E2E failed; source output intentionally suppressed on the public CI bridge."
            exit 1
          fi

      - name: Enforce quality gate
        id: gate
        if: always()
        shell: bash
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          FAILED=0
          for CHECK in TYPECHECK LINT UNIT_TESTS BUILD PLAYWRIGHT_INSTALL E2E; do
            VALUE="${!CHECK}"
            echo "$CHECK=$VALUE"
            if [ "$VALUE" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Odyssey quality gate failed."
            exit 1
          fi
          echo "Odyssey quality gate passed."

      - name: Record validated private commit
        if: success()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > .validated-source-sha
          git config user.name "github-actions[bot]"
          git config user.email "418982821+github-actions[bot]@users.noreply.github.com"
          git add .validated-source-sha
          if git diff --cached --quiet; then
            echo "Validated source SHA already recorded."
            exit 0
          fi
          git commit -m "Record validated Odyssey source commit"
          git pull --rebase origin main
          git push origin HEAD:main
