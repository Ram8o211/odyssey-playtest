name: Coastline temporary visual QA

on:
  push:
    branches: [main]
    paths: ['.github/workflows/coastline-visual-qa.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ram8o211/odyssey-homeward-survival
          ref: art/reference-coastline-natural-pixel-20260928
          token: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund > /tmp/odyssey-install.log 2>&1
      - name: Build
        working-directory: source
        run: npm run build > /tmp/odyssey-build.log 2>&1
      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium > /tmp/odyssey-browser.log 2>&1
      - name: Smoke gameplay in Chrome
        continue-on-error: true
        working-directory: source
        run: npm run test:e2e -- --grep 'starts the systemic|mobile touch UI' > /tmp/odyssey-e2e.log 2>&1
      - name: Capture starting island
        if: always()
        working-directory: source
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/odyssey-preview.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          await mkdir('qa-screenshots', { recursive: true });
          for (const [name, viewport] of [
            ['desktop', { width: 1440, height: 900 }],
            ['mobile', { width: 390, height: 844 }],
          ]) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'load' });
            if (name === 'desktop') await page.keyboard.press('N');
            else await page.locator('[data-action="newGame"]').click();
            await page.waitForTimeout(1800);
            await page.screenshot({ path: `qa-screenshots/${name}.png` });
            const canvasCount = await page.locator('canvas').count();
            console.log(name, JSON.stringify({ canvasCount, errors }));
            if (!canvasCount || errors.length) process.exitCode = 1;
            await page.close();
          }
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastline-screenshots
          path: source/qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 1
