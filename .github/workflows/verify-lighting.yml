name: Verify Odyssey lighting and atmosphere

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-lighting.yml'
      - '.lighting-source-ref'

permissions:
  contents: read

concurrency:
  group: odyssey-lighting-verification
  cancel-in-progress: true

jobs:
  lighting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification request
        uses: actions/checkout@v4

      - name: Resolve source ref
        id: source
        shell: bash
        run: |
          SOURCE_REF="$(tr -d '\r\n' < .lighting-source-ref)"
          test -n "$SOURCE_REF"
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout private Odyssey source
        uses: actions/checkout@v4
        with:
          repository: Ram8o211/odyssey-homeward-survival
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.ODYSSEY_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: |
          if ! npm ci --no-audit --no-fund > /tmp/odyssey-lighting-install.log 2>&1; then
            echo "::error::Dependency installation failed; private source output suppressed."
            exit 1
          fi

      - name: Typecheck, lint, full unit suite and build
        working-directory: source
        run: |
          if ! npm run typecheck > /tmp/odyssey-lighting-typecheck.log 2>&1; then
            echo "::error::Typecheck failed."
            head -60 /tmp/odyssey-lighting-typecheck.log
            exit 1
          fi
          echo "Typecheck passed."
          if ! npx eslint . -f json > /tmp/odyssey-lighting-eslint.json 2>/tmp/odyssey-lighting-eslint.log; then
            echo "::error::Lint failed."
            jq -r '.[] | . as $file | .messages[] | select(.severity == 2) | "\($file.filePath | sub("^.*/source/"; "")):\(.line):\(.column) [\(.ruleId // "unknown")] \(.message)"' /tmp/odyssey-lighting-eslint.json | head -60
            exit 1
          fi
          echo "Lint passed."
          if ! npx vitest run --reporter=json --outputFile=/tmp/odyssey-lighting-vitest.json > /tmp/odyssey-lighting-unit.log 2>&1; then
            echo "::error::Unit/regression tests failed."
            jq -c '{success, numTotalTests, numPassedTests, numFailedTests, numFailedTestSuites, numRuntimeErrorTestSuites}' /tmp/odyssey-lighting-vitest.json
            node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const log = readFileSync('/tmp/odyssey-lighting-unit.log', 'utf8').replace(/\x1b\[[0-9;]*m/g, '');
          for (const line of log.split('\n'))
            if (/^(?:\\s*(?:Error|TypeError|RangeError|SyntaxError|AssertionError|FatalError|FATAL ERROR|Unhandled Error|Unhandled Rejection|Worker exited|Test Files|Tests |Duration |Serialized Error|Caused by:|\\[vitest-pool))/.test(line)) console.log(line.slice(0, 300));
          JS
            jq -r '.testResults[]? | select(.status == "failed") | (.name | sub("^.*/source/"; "")), (.assertionResults[]? | select(.status == "failed") | (.fullName // .title)), (.assertionResults[]? | select(.status == "failed") | .failureMessages[]? | split("\n")[0])' /tmp/odyssey-lighting-vitest.json | head -70
            exit 1
          fi
          jq -r '"Unit/regression tests passed: \(.numPassedTests) tests."' /tmp/odyssey-lighting-vitest.json
          if ! npm run build > /tmp/odyssey-lighting-build.log 2>&1; then
            echo "::error::Production build failed; private source output suppressed."
            exit 1
          fi
          echo "Production build passed."

      - name: Install Chromium
        working-directory: source
        run: npx playwright install --with-deps chromium

      - name: Desktop and touch lighting, shadow contact and gameplay checks
        working-directory: source
        env:
          CI: 'true'
        shell: bash
        run: |
          set +e
          npx playwright test e2e/environment-palette.spec.ts e2e/shadows.spec.ts e2e/smoke.spec.ts --retries=0 --reporter=json > /tmp/odyssey-lighting-e2e.json 2>/tmp/odyssey-lighting-e2e-stderr.log
          STATUS=$?
          set -e
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/odyssey-lighting-e2e.json', 'utf8'));
          console.log(JSON.stringify(report.stats));
          const visit = suites => {
            for (const suite of suites ?? []) {
              for (const spec of suite.specs ?? [])
                if (!spec.ok) {
                  console.log('FAILED: ' + spec.title);
                  for (const test of spec.tests ?? []) {
                    const last = test.results?.at(-1);
                    if (last?.error?.message) console.log('ERROR: ' + last.error.message.split('\n')[0]);
                  }
                }
              visit(suite.suites);
            }
          };
          visit(report.suites);
          JS
          exit "$STATUS"

      - name: Upload atmosphere and landform screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odyssey-lighting-preview
          path: source/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
